# Squidbrake rules - hot-reloaded on save, no restart needed.
#
# Policy: agents may LOOK at anything (read, list, search). Coding agents do everyday work on their own (edits,
# tests, builds, commits), but what can't be undone waits for a person and what's catastrophic is blocked. Any other
# change (sends, refunds, pays, updates, deletes, pushes) waits for a person, and so does an agent changing its own
# settings, hooks or MCP servers, Squidbrake's rules, or a secrets file.
#
# Rules are checked top to bottom; the FIRST match wins. If none match, `default` applies.
# match fields (all optional, all must match):
#   kind, name, source, client, session_id   glob pattern or list of globs (case-insensitive), e.g. "shell*"
#   input_regex                              regex searched in the JSON of the call's input
#   input                                    number checks on input fields: {field: {op: number}}, ops gt gte lt lte eq ne,
#                                            e.g. input: { amount: { gt: 100 } }; "a.b" reaches nested fields; a missing
#                                            or non-numeric field doesn't match
# action: allow | deny | review
#
# Example - let small refunds run on their own (put it above approve-refunds to use it):
#   - id: allow-small-refunds
#     action: allow
#     reason: Small refund - runs on its own
#     match:
#       name: ["*refund*"]
#       input: { amount: { gte: 0, lte: 50 } }
# For allow rules use a range: `lte: 50` alone would also let through a negative amount like -5000.
# Amounts are in your API's units - Stripe sends cents, so 50 dollars is 5000 there.
#
# review = hold the call until a person approves or rejects it (dashboard, phone, Slack).
#   timeout_seconds  how long to wait for a person (default APPROVAL_TIMEOUT, 300)
#   on_timeout       deny (default) | allow  - what happens if nobody decides in time
#   approvers        who may decide: key names or roles, e.g. ["role:finance", "priya"]; default = any approver
# A key can never approve its own request.

default: review
default_reason: This changes something, so a person has to approve it

# enforce: block and hold for real. shadow: block and hold nothing, only record what would have happened
# (Reports shows "would block" / "would hold"), which is the easy way to try Squidbrake on real work.
# Stops and catastrophic commands (rm -rf /, wiping a drive) are enforced in shadow mode too.
mode: enforce
shadow_agents: []          # shadow mode for just these agents (source or key names, globs), e.g. ["new-bot*"]

# History checks look at what happened BEFORE an action, not just the action itself.
# Each one: block (stop it), review (a person decides), warn (flag it for the approver), off.
history_checks:
  company_domains: [acme.com]          # your real email domains; look-alikes (acrne.com, acme-corp.com) are suspicious
  lookback_hours: 24
  repeat_of_rejected: review           # an action a person already rejected (same tool + same target) goes back to a
                                       # person, flagged with their earlier no and note (block: refuse it outright)
  impersonation: block                 # moving money right after reading a message from a look-alike of your domain
  payment_request_in_message: review   # moving money right after reading a message that asks for a payment
  duplicate_change: warn               # the same change on the same thing again (e.g. a 2nd refund on one charge)

# Command checks read what a shell command actually DOES before it runs: they split `a && b`, look inside
# `bash -c "..."`, `sudo`, `xargs` and `$(...)`, and understand rm / git / terraform / kubectl / cloud CLIs / SQL.
# Each one: block, review, warn, off. They apply even when a rule below allows the tool.
command_checks:
  tools: ["Bash", "PowerShell", "*shell*", "*run_command*", "*execute_command*", "*terminal*", "*exec_command*"]
  catastrophic: block     # rm -rf /, rm -rf ~, wiping a drive (rmdir /s d:\), mkfs, dd onto a disk, chmod -R 777 /
  irreversible: review    # rm -r, git push --force, git reset --hard, terraform destroy, kubectl delete, cloud deletes, DROP TABLE
  hidden: review          # code that can't be read first: eval, curl ... | sh, base64 -d | bash, powershell -EncodedCommand,
                          # programs written inline (python -c, node -e, perl -e), a program named only when it runs
  written_then_run: review  # a script the agent created in this conversation, then runs (python x.py): read it first
  unknown: warn           # a program that isn't a common developer tool: recorded so you can see what would wait;
                          # review holds them too
  read_only: allow        # commands that only look (ls, cat, grep, git status/log/diff) run without asking,
                          # unless a rule below says otherwise. Set to off to approve those too.

# Taint checks catch prompt injection without a model: content someone else wrote (a web page, an email, an issue)
# says "send X to <attacker>", and the agent does. When an action sends something to a destination (email address,
# URL, bank account, repo) that appears in that outside content but NOT in what the user asked (Claude Code prompts
# are recorded) or in your own tools' results, it came from the outside content.
taint_checks:
  untrusted_destination: review   # sends to an address/URL/account found only in outside content
  after_untrusted: warn           # sends anything out after outside content was read in this conversation
  lookback_hours: 24
  # untrusted: [...]  tools whose results are outside content (defaults: WebFetch, *fetch*, *inbox*, *issue*, *ticket* ...)
  # sinks: [...]      tools that send things out (defaults: *send*, *reply*, *publish*, *transfer*, *webhook*, *upload* ...)
  #                   Shell commands count as sinks when they upload (curl -d, scp, git push, ...).

# Data checks look at text an action puts where other people read it: a pull request, an issue or comment, a gist, a
# chat post, a page (and `gh pr|issue|gist ... create|comment|edit`). Looking things up doesn't count. Email has its
# own rule above. Each one: block, review, warn, off.
data_checks:
  customer_names: review   # names a customer on your list (dashboard → Settings → Customers), e.g. in a PR description
  personal_data: review    # a card number, a social security number, an IBAN, or a list of 3+ emails or phone numbers
  # where: [...]           tools whose text others read (defaults: *pull_request*, *issue*, *comment*, *gist*, ...)

# Sequence rules judge an action by what came BEFORE it, and say which earlier step caused it.
#   match   this action (same fields as rules: name, source, input_regex, input, ...)
#   after   an earlier step that went ahead, within within_hours (default 24);
#           scope: session (the same conversation, the default) | agent (any conversation of this agent) | all (any agent);
#           same_target: true = only if it was on the same thing (same charge, file, account ...)
#   count   more than `more_than` earlier matching actions within within_hours; scope: session | agent | all;
#           sum: <field> = add up that input field (this action plus earlier ones) instead of counting actions
#             (missing or non-numeric values count as 0); same_target: true = only earlier actions on the same thing
#   action  deny | review | warn
sequences:
  - id: destroy-after-recovery-removed
    action: review
    reason: Destroying data right after its backups or deletion protection were turned off
    match:
      input_regex: 'delete[-_ ]?db[-_ ]?(instance|cluster|snapshot)|delete[-_ ]?(bucket|volume|database|snapshot)|volumeDelete|s3\s+rb\b|terraform\s+destroy|drop\s+(table|database)'
    after:
      match:
        input_regex: 'backup[-_ ]?retention[-_ ]?period\W{0,4}0\b|disable[-_ ]?backup|delete[-_ ]?(db[-_ ]?)?snapshot|deletion[-_ ]?protection\W{0,4}(false|0)\b|no-deletion-protection|point[-_ ]?in[-_ ]?time[-_ ]?recovery\W{0,4}(false|disabled)'
      within_hours: 24
      scope: all          # backups switched off by any agent, in any conversation, then a delete

  - id: runaway-refunds
    action: deny
    reason: Too many refunds in a short time; the agent may be stuck in a loop
    match: { name: ["*refund*"] }
    count: { more_than: 10, within_hours: 1, scope: agent }

  - id: mass-deletes
    action: review
    reason: Many deletions in a short time
    match: { input_regex: '\b(delete|destroy|drop|rm\s+-|rmdir|remove-item)\b' }
    count: { more_than: 20, within_hours: 0.25, scope: session }

rules:
  # ---- never allowed
  - id: block-destructive-shell
    action: deny
    reason: Destructive shell command
    match:
      name: ["shell*", "bash*", "powershell*", "exec*", "run_command*"]
      input_regex: 'rm\s+-(rf|fr)\s+(/|~|\*)|mkfs|dd\s+if=|:\(\)\s*\{|shutdown|reboot|Remove-Item\s.*-Recurse.*\s(C:\\\\|~|\$HOME)'

  - id: block-sql-drop
    action: deny
    reason: Dropping or truncating tables is not allowed
    match:
      name: ["sql*", "db*", "*query*"]
      input_regex: '\b(drop\s+(table|database|schema)|truncate\s+table)\b'

  - id: block-secret-files
    action: deny
    reason: Reading secret files is not allowed
    match:
      name: ["read*", "file*", "cat*"]
      input_regex: '\.env\b|id_rsa|\.pem\b|credentials'

  # ---- an agent changing its own guard rails: its settings, hooks and MCP servers, Squidbrake's own files,
  # secrets, and files that run code at login or on every commit. Squidbrake would be easy to switch off without this.
  - id: approve-guard-rail-changes
    action: review
    reason: Changes an AI agent's own settings, hooks or MCP servers, Squidbrake itself, a secrets file, or code that runs at login
    match:
      name: ["Edit", "Write", "MultiEdit", "NotebookEdit", "bash*", "powershell*", "shell*", "run_command*"]
      input_regex: '(?i)\.(claude|cursor|codex|gemini|copilot|kiro|codeium|windsurf|squidbrake)[\\/]|mcp(_config)?\.json|claude_desktop_config\.json|\.vscode[\\/]+(mcp|tasks)\.json|\.env\b(?!\.?(example|sample|template))|\.ssh[\\/]|\.aws[\\/]|\.(npmrc|pypirc|netrc)\b|\.(bashrc|zshrc|bash_profile|zprofile|profile)\b|PowerShell_profile\.ps1|\.git[\\/]+hooks[\\/]|managed-settings\.json|(/etc/|ProgramData[\\/]+|Program Files[\\/]+|Application Support/)(ClaudeCode|claude-code|codex|gemini-cli|cursor|squidbrake|OpenAI)\b'

  # ---- looking is fine: reading, listing, searching run without asking (and are still recorded)
  - id: allow-reads
    action: allow
    reason: Only looks at information
    match:
      name: ["*.list*", "*_list*", "list*", "*.get*", "*_get*", "get*", "*.read*", "*_read*", "*.find*", "*_find*", "find*",
             "*.search*", "*_search*", "search*", "*.describe*", "*_describe*", "*.query*", "*.fetch*", "*_fetch*",
             "*.view*", "*_view*", "*.show*", "*_show*", "*.count*", "*_count*", "*.lookup*", "*_lookup*",
             # Claude Code's own read-only / housekeeping tools
             "Read", "Grep", "Glob", "LS", "WebSearch", "WebFetch", "NotebookRead", "ToolSearch", "TodoWrite",
             "Task", "Agent", "AskUserQuestion", "EnterPlanMode", "ExitPlanMode", "Skill", "BashOutput", "TaskOutput",
             "ListMcpResourcesTool", "ReadMcpResourceTool",
             # Antigravity's own read-only / housekeeping tools (its file reads, edits and commands are checked above)
             "read_url_content", "view_content_chunk", "read_resource", "read_terminal", "command_status",
             "manage_task", "task_boundary", "notify_user"]

  # ---- changes: a person decides (these give the approver a clearer reason than the default)
  - id: approve-money-out
    action: review
    reason: Bank transfers, wires and payouts need finance sign-off
    timeout_seconds: 900
    approvers: ["role:finance", "role:admin"]
    match:
      name: ["*transfer*", "*wire*", "*payout*"]

  - id: approve-refunds
    action: review
    reason: Refund - money goes back to a customer
    timeout_seconds: 600
    match:
      name: ["*refund*"]

  - id: approve-outbound-email
    action: review
    reason: Email to someone outside the company
    timeout_seconds: 600
    match:
      name: ["email.send", "mail.*", "*send_email*", "*email_send*", "*send_mail*", "*gmail*send*"]
      input_regex: '"to"\s*:\s*"[^"]*@(?!acme\.com")'   # change acme.com to your company's email domain

  - id: approve-writes-to-db
    action: review
    reason: Changes data in the database
    match:
      name: ["sql*", "db*", "*query*"]
      input_regex: '\b(delete\s+from|update\s+\S+\s+set|alter\s+table|insert\s+(or\s+\w+\s+)?into|replace\s+into)\b'

  # Pushing a named feature branch is everyday work (it runs); pushing main, master, a release or production branch,
  # tags, everything, or the current branch without naming it waits for a person. Force pushes are held by the
  # command checks whatever the branch.
  - id: approve-git-push
    action: review
    reason: Pushing to a shared branch (main, master, release, production), tags, or an unnamed branch
    match:
      name: ["bash*", "shell*", "powershell*", "run_command*"]
      input_regex: 'git\s+push((\s+-\S+)*(\s+[^\s"&;|-]\S*)?\s*("|&&|;|\|)|[^"&;|]*\s(\S+:)?(main|master|trunk|develop|release\S*|prod|production|HEAD)\b|[^"&;|]*\s--(all|tags|mirror)\b)'

  - id: approve-prod-deploys
    action: review
    reason: Production deploy
    timeout_seconds: 900
    match:
      name: ["deploy*", "release*"]
      input_regex: '\bprod(uction)?\b'

  # ---- coding agents: everyday work runs on its own, so nobody turns Squidbrake off out of approval fatigue.
  # The command checks still hold what can't be undone (git push --force, cloud deletes, DROP TABLE, curl | sh)
  # and block what's catastrophic (rm -rf ~/, wiping a disk); the rule above holds changes to the guard rails.
  - id: allow-coding-work
    action: allow
    reason: Everyday coding work (edits, tests, builds, installs, commits)
    match:
      name: ["Edit", "Write", "MultiEdit", "NotebookEdit", "Bash", "PowerShell"]

# Upstreams for the HTTP proxy:  /proxy/<name>/<path>  ->  <url>/<path>
upstreams:
  httpbin: https://httpbin.org
