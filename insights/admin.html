<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squidbrake Insights</title>
<style>
:root { --bg:#f7f7f5; --surface:#fff; --ink:#151515; --ink-2:#3d3d42; --muted:#6c6c73; --faint:#a3a3aa;
        --line:#e6e6e1; --line-2:#f1f1ed; --accent:#d9480f; --ok:#16803c; --warn:#b45309; --bad:#c2271b; --link:#1f4fd1;
        --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f0f10; --surface:#161618; --ink:#ededee; --ink-2:#c9c9cd; --muted:#8e8e96;
        --faint:#5c5c63; --line:#26262a; --line-2:#1d1d20; --accent:#f06a2f; --ok:#3fbf6c; --warn:#e3a33b; --bad:#f2554a; --link:#7aa2ff; } }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; scroll-padding-top:64px; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
button, input, textarea { font:inherit; color:inherit; }
a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
code { font:12.5px var(--mono); }

.top { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 90%, transparent);
       backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.top .in { max-width:1240px; margin:0 auto; padding:10px 28px; display:flex; align-items:center; gap:22px; }
.brand { font-weight:650; font-size:15px; letter-spacing:-.01em; white-space:nowrap; }
.brand b { color:var(--accent); font-weight:650; } .brand small { color:var(--muted); font-weight:450; font-size:13px; margin-left:6px; }
.top nav { display:flex; gap:18px; flex-wrap:wrap; }
.top nav a { color:var(--muted); font-size:13px; } .top nav a:hover { color:var(--ink); text-decoration:none; }
.spacer { flex:1; }
main { max-width:1240px; margin:0 auto; padding:30px 28px 72px; }

section { margin-bottom:40px; }
.sec-h { display:flex; align-items:flex-end; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.sec-h h2 { font-size:15px; font-weight:600; margin:0; letter-spacing:-.005em; }
.sec-h .sub { margin-bottom:1px; }
.sec-h .act { margin-left:auto; display:flex; gap:8px; }
.sub { color:var(--muted); font-size:13px; }
.mini { color:var(--muted); font-size:12.5px; margin-top:2px; }
.mini b { color:var(--ink); font-weight:600; }
.foot { color:var(--faint); font-size:12.5px; max-width:780px; }

.btn { display:inline-flex; align-items:center; height:30px; padding:0 12px; border:1px solid var(--line); background:var(--surface);
       border-radius:7px; font-size:13px; cursor:pointer; color:var(--ink); white-space:nowrap; }
.btn:hover { border-color:var(--faint); text-decoration:none; }
.btn.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.btn.ghost { border-color:transparent; background:none; color:var(--muted); } .btn.ghost:hover { color:var(--ink); }
.icon-btn { border:0; background:none; color:var(--faint); cursor:pointer; padding:4px 6px; font-size:13px; }
.icon-btn:hover { color:var(--bad); }

.surface { background:var(--surface); border:1px solid var(--line); border-radius:10px; }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); background:var(--surface);
         border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.stats.cols4 { grid-template-columns:repeat(4, minmax(0, 1fr)); }
@media (max-width:720px) { .stats.cols4 { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
.stat { padding:14px 16px 13px; box-shadow:inset -1px -1px 0 var(--line-2); min-width:0; }
.stat .k { font-size:12px; color:var(--muted); }
.stat .v { font-size:22px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-top:3px; line-height:1.2; }
.stat .v small { font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0; margin-left:4px; }
.stat .n { font-size:12px; color:var(--muted); margin-top:3px; }
.stat.warn .n, .stat .n.warn { color:var(--warn); }
.up { color:var(--ok); } .down { color:var(--bad); }

.grid2 { display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 7fr); gap:16px; }
.fun { padding:16px 18px 14px; }
.fun .r { display:grid; grid-template-columns:minmax(0, 1fr) 46px; gap:4px 12px; padding:7px 0; }
.fun .r + .r { border-top:1px solid var(--line-2); }
.fun .l { font-size:13px; color:var(--ink-2); }
.fun .c { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
.fun .bar { grid-column:1 / -1; height:6px; background:var(--line-2); border-radius:3px; overflow:hidden; }
.fun .bar i { display:block; height:100%; background:var(--ink-2); opacity:.8; border-radius:3px; }
.fun .cv { grid-column:1 / -1; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.weeks { padding:14px 18px 12px; border-top:1px solid var(--line); display:flex; align-items:flex-end; gap:14px; }
.weeks .lbl { font-size:12px; color:var(--muted); width:120px; flex:none; align-self:center; }
.wbars { display:flex; align-items:flex-end; gap:8px; height:56px; flex:1; }
.wbars div { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:3px;
             font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
.wbars i { display:block; width:100%; max-width:28px; background:var(--faint); border-radius:2px; }
.wbars div:last-child i { background:var(--accent); } .wbars div:last-child { color:var(--ink); font-weight:600; }

.table-wrap { overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
table { width:100%; border-collapse:collapse; min-width:960px; }
th, td { text-align:left; padding:12px 14px; vertical-align:top; }
th { font-size:11.5px; color:var(--muted); font-weight:500; letter-spacing:.03em; text-transform:uppercase;
     border-bottom:1px solid var(--line); padding-top:10px; padding-bottom:10px; white-space:nowrap; }
tbody > tr:not(.catches) + tr:not(.catches) > td, tr.catches + tr > td { border-top:1px solid var(--line-2); }
tbody > tr:not(.catches):hover > td { background:color-mix(in srgb, var(--line-2) 55%, transparent); }
td.num { font-variant-numeric:tabular-nums; }
.co { font-weight:600; }
.code { font:12px var(--mono); color:var(--muted); }
.acts { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }

.pill { display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500; white-space:nowrap; color:var(--ink-2); }
.pill::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--faint); flex:none; }
.s-active::before { background:var(--ok); } .s-installed::before { background:var(--link); }
.s-quiet::before, .s-opened::before { background:var(--warn); } .s-sent::before, .s-left::before { background:var(--faint); }
.health { font-size:12px; font-weight:500; } .health.risk { color:var(--warn); } .health.churn { color:var(--bad); }
.chip { display:inline-block; border:1px solid var(--line); border-radius:5px; padding:0 6px; margin:0 4px 4px 0; font-size:12px; color:var(--ink-2); }
.chip.r { font:11.5px var(--mono); }
.spark { display:flex; align-items:flex-end; gap:2px; height:30px; }
.spark i { display:block; width:6px; background:var(--ink); opacity:.55; border-radius:1px; min-height:1px; }

tr.catches > td { padding:0 14px 12px; }
#stopped tr.hold { display:none; }
#stopped.show-all tr.hold { display:table-row; }
#stopped.show-all .stopped-none { display:none; }
tr.catches summary { cursor:pointer; font-size:12.5px; color:var(--muted); padding:2px 0 6px; list-style:none; }
tr.catches summary::before { content:"\25B8"; display:inline-block; width:14px; transition:transform .15s; }
tr.catches details[open] summary::before { transform:rotate(90deg); }
tr.catches summary:hover { color:var(--ink); }
table.inner { min-width:0; font-size:13px; border:1px solid var(--line-2); border-radius:8px; border-collapse:separate; border-spacing:0; }
table.inner th, table.inner td { padding:7px 12px; border:0; } table.inner th { background:var(--line-2); text-transform:none; letter-spacing:0; font-size:12px; }
table.inner tbody tr td { border-top:1px solid var(--line-2); }
.o-approved { color:var(--ok); } .o-rejected, .o-blocked { color:var(--bad); } .o-waiting, .o-timed { color:var(--warn); }

form.new { display:grid; grid-template-columns:2fr 2fr 3fr auto; gap:8px; padding:16px; }
form.new input[type=text], form.new input:not([type]) { height:34px; border:1px solid var(--line); background:var(--bg); border-radius:7px; padding:0 10px; }
form.new input:focus, .login input:focus { outline:2px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset:0; border-color:var(--accent); }
form.new .btn { height:34px; }
.hosted-opt { grid-column:1 / -1; color:var(--muted); font-size:13px; }
.hosted-opt input { margin:0 6px 0 0; vertical-align:-2px; accent-color:var(--ink); }
.result { margin:0 16px 16px; padding:14px; border-radius:8px; background:var(--line-2); display:none; }
.result textarea { width:100%; min-height:150px; border:1px solid var(--line); border-radius:7px; padding:10px; background:var(--surface); }
.result .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
.empty { padding:28px 16px; color:var(--muted); text-align:center; font-size:13px; }
.notice { display:flex; gap:12px; align-items:center; padding:12px 16px; margin-bottom:28px; border:1px solid color-mix(in srgb, var(--warn) 40%, var(--line));
          background:color-mix(in srgb, var(--warn) 6%, var(--surface)); border-radius:10px; font-size:13px; }
.login { max-width:380px; margin:14vh auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:26px; }
.login input { width:100%; height:36px; border:1px solid var(--line); background:var(--bg); border-radius:7px; padding:0 11px; margin:12px 0 10px; }
.login .btn { width:100%; justify-content:center; height:36px; }
.err { color:var(--bad); min-height:1.2em; font-size:13px; margin-top:8px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:10; padding:0 16px; }
/* ---------- polish */
:root { --shadow: 0 1px 2px rgba(20,20,20,.04), 0 6px 20px -8px rgba(20,20,20,.08); --radius:12px;
        --tint-ok: color-mix(in srgb, var(--ok) 12%, transparent); --tint-warn: color-mix(in srgb, var(--warn) 13%, transparent);
        --tint-bad: color-mix(in srgb, var(--bad) 12%, transparent); --tint-link: color-mix(in srgb, var(--link) 11%, transparent); }
@media (prefers-color-scheme: dark) { :root { --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -10px rgba(0,0,0,.6); } }
body { background: radial-gradient(1200px 380px at 12% -120px, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%),
                   radial-gradient(900px 320px at 95% -140px, color-mix(in srgb, var(--link) 7%, transparent), transparent 70%), var(--bg);
       background-attachment: fixed; }
.top .mark { width:22px; height:22px; flex:none; color:var(--ink); }
.brand { display:inline-flex; align-items:center; gap:8px; }
.top nav { flex-wrap:nowrap; gap:14px; overflow-x:auto; scrollbar-width:none; min-width:0; }
.top nav a { padding:4px 0; border-bottom:2px solid transparent; white-space:nowrap; }
.top nav a:hover { border-bottom-color:var(--accent); }
.hello { display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin:6px 0 26px; }
.hello h1 { font-size:26px; line-height:1.15; letter-spacing:-.025em; margin:0 0 4px; font-weight:650; }
.hello .sub { font-size:14px; }
.hello .chips { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
.big-chip { display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background:var(--surface);
            border:1px solid var(--line); box-shadow:var(--shadow); font-size:13px; color:var(--ink-2); }
a.big-chip:hover { text-decoration:none; border-color:var(--faint); }
.big-chip b { font-size:15px; color:var(--ink); font-variant-numeric:tabular-nums; }
.big-chip i { width:8px; height:8px; border-radius:50%; background:var(--faint); }
.big-chip.ok i { background:var(--ok); } .big-chip.accent i { background:var(--accent); } .big-chip.warn i { background:var(--warn); }

.surface, .stats, .table-wrap { border-radius:var(--radius); box-shadow:var(--shadow); }
.sec-h h2 { display:inline-flex; align-items:center; gap:9px; font-size:16px; }
.sec-h h2::before { content:""; width:4px; height:16px; border-radius:2px; background:var(--accent); }
.stat { position:relative; padding:16px 18px 15px; }
.stat::before { content:""; position:absolute; left:18px; top:0; width:28px; height:3px; border-radius:0 0 3px 3px; background:var(--tone, var(--faint)); }
.stat .v { font-size:26px; font-weight:650; }
.stat.t-ok { --tone:var(--ok); } .stat.t-accent { --tone:var(--accent); } .stat.t-link { --tone:var(--link); }
.stat.t-warn, .stat.warn { --tone:var(--warn); } .stat.t-bad { --tone:var(--bad); }
.stat.warn { background:color-mix(in srgb, var(--warn) 5%, transparent); }

.pill { padding:3px 10px 3px 9px; border-radius:999px; background:var(--line-2); font-size:12.5px; }
.s-active { background:var(--tint-ok); color:var(--ok); } .s-installed { background:var(--tint-link); color:var(--link); }
.s-quiet, .s-opened { background:var(--tint-warn); color:var(--warn); }
.health { display:inline-block; margin-top:5px; padding:1px 8px; border-radius:999px; }
.health.risk { background:var(--tint-warn); } .health.churn { background:var(--tint-bad); }
.chip { border-radius:999px; padding:1px 9px; background:var(--line-2); border-color:transparent; }
.spark i { background:var(--accent); opacity:.35; border-radius:2px; width:7px; }
.spark i:last-child { opacity:1; }
.fun .bar i { background:linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #f5b041)); opacity:1; }
.wbars i { border-radius:3px; }
th { background:color-mix(in srgb, var(--line-2) 60%, transparent); }
.table-wrap thead th:first-child { border-top-left-radius:var(--radius); }
.table-wrap thead th:last-child { border-top-right-radius:var(--radius); }
.btn { border-radius:8px; transition:border-color .15s, background .15s, transform .05s; }
.btn:active { transform:translateY(1px); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover { background:color-mix(in srgb, var(--accent) 88%, #000); }
.empty { padding:34px 16px; }
.login { box-shadow:var(--shadow); border-radius:16px; }

/* where people come from: a little funnel per channel */
.src-bar { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--line-2); width:160px; margin-top:7px; }
.src-bar i { display:block; height:100%; }
.src-bar i.c { background:color-mix(in srgb, var(--link) 40%, transparent); } .src-bar i.n { background:var(--link); }
.src-bar i.u { background:var(--ok); }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); padding:10px 16px 12px; border-top:1px solid var(--line-2); }
.legend span::before { content:""; display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; background:var(--c); }

@media (max-width:900px) { .grid2 { grid-template-columns:1fr; } .top nav { display:none; } }
@media (max-width:720px) { form.new { grid-template-columns:1fr; } main, .top .in { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
const app = document.getElementById("app");
const store = { get: () => { try { return localStorage.getItem("insightsKey") || ""; } catch { return ""; } },
                set: (v) => { try { v ? localStorage.setItem("insightsKey", v) : localStorage.removeItem("insightsKey"); } catch {} } };
let key = store.get();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts, headers: { "X-Admin-Key": key, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) { store.set(""); key = ""; login("Please sign in again."); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
};
const ago = (iso) => {
  if (!iso) return "never";
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  return s < 90 ? "just now" : s < 5400 ? `${Math.round(s / 60)} min ago` : s < 129600 ? `${Math.round(s / 3600)} h ago` : `${Math.round(s / 86400)} d ago`;
};
let d_latest = "";
const STAGE = { "active": ["Active", "s-active"], "installed": ["Installed, no activity yet", "s-installed"],
  "quiet": ["Gone quiet", "s-quiet"], "opened link": ["Opened the link", "s-opened"], "link sent": ["Link sent", "s-sent"],
  "left": ["Left the pilot", "s-left"], "setting up": ["Setting up", "s-installed"], "keys taken": ["Took keys, not connected yet", "s-opened"],
  "setup failed": ["Setup failed", "s-quiet"], "deleting": ["Deleting", "s-left"],
  "installed · agent not connected": ["Installed · agent not connected", "s-quiet"],
  "agent connected": ["Agent connected, no actions yet", "s-installed"] };

function login(msg = "") {
  app.innerHTML = `<div class="login"><div class="brand">Squid<b>brake</b> <small>Pilots</small></div>
    <p class="sub">Your pilots, at a glance. Sign in with your password (the first time: the server key from the .env).</p>
    <form id="lf"><input id="lk" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button class="btn primary">Sign in</button><div class="err">${esc(msg)}</div></form></div>`;
  document.getElementById("lf").onsubmit = async (e) => {
    e.preventDefault();
    const r = await fetch("/v1/admin/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: document.getElementById("lk").value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return login(d.detail || "Couldn't sign in.");
    key = d.token; store.set(key); load();
  };
}

function passwordDialog(first) {
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<form class="login" id="pf" style="margin:10vh auto">
    <div class="brand">${first ? "Set your password" : "Change password"}</div>
    <p class="sub">${first ? "Use this from now on instead of the server key." : "Other signed-in browsers will be signed out."}</p>
    <input id="pc" type="password" placeholder="${first ? "Server key (from the .env)" : "Current password"}" autocomplete="current-password" required>
    <input id="pn" type="password" placeholder="New password (10+ characters)" autocomplete="new-password" minlength="10" required>
    <input id="pr" type="password" placeholder="New password again" autocomplete="new-password" minlength="10" required>
    <div class="row" style="display:flex;gap:8px"><button class="btn primary">Save</button><button class="btn" type="button" id="px">Cancel</button></div>
    <div class="err" id="pe"></div></form>`;
  document.body.appendChild(box);
  box.querySelector("#px").onclick = () => box.remove();
  box.querySelector("#pf").onsubmit = async (e) => {
    e.preventDefault();
    const [cur, nw, again] = ["#pc", "#pn", "#pr"].map((s) => box.querySelector(s).value);
    if (nw !== again) return (box.querySelector("#pe").textContent = "The new passwords don't match.");
    try {
      await api("/v1/admin/password", { method: "POST", body: JSON.stringify({ current: cur, new: nw }) });
      box.remove(); store.set(""); key = ""; login("Password saved. Sign in with it.");
    } catch (err) { if (err.message !== "unauthorized") box.querySelector("#pe").textContent = err.message; }
  };
}

function followUp(p) {
  const hi = `Hi ${p.contact ? p.contact.split(/[ ,]/)[0] : p.company + " team"}! `;
  return {
    "link sent": hi + `Did you get a chance to try Squidbrake? It takes about 2 minutes, everything is here:\n${p.link}`,
    "opened link": hi + `Saw you opened the Squidbrake setup page. Anything that got in the way? Happy to do a quick 5-minute call and set it up together.\n${p.link}`,
    "keys taken": hi + `Your dashboard is ready, the last bit is connecting Claude Code: step 2 on ${p.link} (one command), then restart Claude Code. Want me to walk you through it?`,
    "installed": hi + `You're all set up! Restart Claude Code if you haven't, then try asking it to print your .env file: Squidbrake should block it.`,
    "installed · agent not connected": hi + `Squidbrake is installed and running, but no AI agent is connected to it yet, so it can't see anything. One command does it: squidbrake connect all (then restart your agents). Want me to do it with you on a quick call?`,
    "agent connected": hi + `Your agents are connected! Restart them if you haven't (quit Cursor / Claude Code and open them again), then work as usual: you'll see every action in your dashboard.`,
    "quiet": hi + `Haven't seen activity from Squidbrake in a few days. Was something annoying, like too many approvals? I can tune the rules for you, or switch it to shadow mode (it just records what it would block).`,
    "active": hi + `How's Squidbrake working for you so far? Anything it held that it shouldn't have, or something it should have caught? 2 minutes of feedback would help a lot.`,
  }[p.stage];
}

function message(company, link, hosted) {
  if (hosted) return `Hi ${company} team! Here's Squidbrake, the brake for AI coding agents I mentioned.\n\n` +
    `It checks every action your agent (Claude Code, Cursor, Antigravity...) takes before it runs: reading runs on its own, ` +
    `changes wait for one click (on your phone too), and dangerous stuff (wiping folders, printing .env, dropping tables) is blocked.\n\n` +
    `I've set up your own dashboard, so there's nothing to run on your laptop. Setup is ~2 minutes, everything is on this page:\n${link}\n\n` +
    `Would love your honest feedback after a few days of real work!`;
  return `Hi ${company} team! Here's Squidbrake, the brake for AI coding agents I mentioned.\n\n` +
    `It checks every action your agent (Claude Code, Cursor, Antigravity...) takes before it runs: reading runs on its own, ` +
    `changes wait for one click, and dangerous stuff (wiping folders, printing .env, dropping tables) is blocked. ` +
    `It runs on your machine.\n\nSetup is ~3 minutes, everything is on this page:\n${link}\n\n` +
    `It shares only usage counts with me (never your code or commands), so I can see what helps. ` +
    `Would love your honest feedback after a few days of real work!`;
}

async function load() {
  if (!key) return login();
  let d, me, asks, inv, fails, src;
  try { [d, me, asks, inv, fails, src] = await Promise.all([api("/v1/admin/overview"), api("/v1/admin/me"), api("/v1/admin/team-requests"),
                                                api("/v1/admin/traction"), api("/v1/admin/install-reports"), api("/v1/admin/sources")]); }
  catch (e) { if (e.message !== "unauthorized") app.innerHTML = `<main><p class="err">${esc(e.message)}</p></main>`; return; }
  const w = d.week;
  d_latest = d.latest_version || "";
  app.innerHTML = `
    <div class="top"><div class="in"><div class="brand"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><path fill="currentColor" d="M16 30V21.5C16 12.4 23.2 5 32 5C40.8 5 48 12.4 48 21.5V30Z"/><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M23 34V48.2C23 51.4 21.7 53.9 19.6 55.8"/><path d="M32 34V44.6"/><path d="M41 34V48.2C41 51.4 42.3 53.9 44.4 55.8"/></g><circle fill="currentColor" cx="32" cy="52.6" r="2.9"/><rect fill="#F2622E" x="11" y="24.5" width="42" height="11" rx="5.5"/><circle fill="#2FD574" cx="41.2" cy="30" r="2.5"/></svg><span>Squid<b>brake</b></span> <small>Pilots</small></div>
      <nav><a href="#week">This week</a><a href="#stopped">Stopped</a><a href="#traction">Traction</a><a href="#pilots">Pilots</a><a href="#sources">Sources</a><a href="#requests">Requests</a><a href="#fails">Failed installs</a><a href="#new">New pilot</a></nav>
      <span class="spacer"></span>
      <button class="btn ghost" id="refresh">Refresh</button><button class="btn ghost" id="pw">${me.has_password ? "Password" : "Set password"}</button>
      <button class="btn ghost" id="logout">Sign out</button></div></div>
    <main>
    ${me.has_password ? "" : `<div class="notice"><span><b>Set your own password</b> so you don't have to sign in with the server key.</span>
      <button class="btn" id="pw2" style="margin-left:auto">Set password</button></div>`}
    <div class="hello"><div><h1>${greeting()}</h1>
        <div class="sub">${new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" })} ·
          ${d.pilots.length} pilots · ${d.installs} installs</div></div>
      <div class="chips"><span class="big-chip ok"><i></i><b>${d.scorecard.active_this_week}</b> active this week</span>
        <span class="big-chip accent"><i></i><b>${d.scorecard.stopped}</b> stopped</span>
        ${asks.filter((a) => !a.done).length ? `<a class="big-chip warn" href="#requests"><i></i><b>${asks.filter((a) => !a.done).length}</b> waiting for a reply</a>` : ""}</div></div>
    <section id="week"><div class="sec-h"><h2>This week</h2>
        <span class="sub">${d.pilots.length} pilots · ${d.installs} installs · ${w.events.toLocaleString()} actions${w.would_block ? ` · ${w.would_block} would block (shadow)` : ""}</span>
        <div class="act"><button class="btn" data-copy="${esc(weeklyReport(d))}">Copy weekly report</button></div></div>
      <div class="stats cols4">
        ${stat("Active this week", d.scorecard.active_this_week, `${d.scorecard.active_today} today`, false, "ok")}
        ${stat("Active 3+ days", d.scorecard.active_3_plus_days, "", false, "ok")}
        ${stat("Back from last week", `${d.scorecard.retained}<small>of ${d.scorecard.active_last_week}</small>`, "", false, "link")}
        ${stat("Held for a person", w.held, "", false, "warn")}${stat("Blocked", w.blocked, "", false, "bad")}
        ${stat("Holds approved", d.scorecard.approve_rate === null ? "–" : d.scorecard.approve_rate + "%",
               d.scorecard.approve_rate > 90 ? "Over 90%: rules may be holding routine work" : "", d.scorecard.approve_rate > 90, "link")}
        ${stat("At risk · churned", `${d.scorecard.at_risk}<small>·</small> ${d.scorecard.churned}`, "3+ / 7+ days without activity", d.scorecard.at_risk + d.scorecard.churned > 0, "warn")}
        ${stat("Stopped", d.scorecard.stopped, (savedText(d.scorecard.saved) ? "saved " + savedText(d.scorecard.saved) : "caught by a rule") +
               (d.scorecard.paused ? ` · paused by emergency stop: ${d.scorecard.paused}` : ""), false, "accent")}
      </div></section>
    ${stoppedPanel(d.pilots)}

    </section>
    ${teamPanel(asks)}
    ${sourcesPanel(src)}
    ${failsPanel(fails)}
    <section id="new"><div class="sec-h"><h2>New pilot</h2><span class="sub">Creates a setup link; with Hosted, their own dashboard too</span></div>
      <div class="surface"><form class="new" id="nf"><input id="nc" placeholder="Company, e.g. Pilot C" required maxlength="80">
        <input id="nk" placeholder="Contact (name, email, phone)" maxlength="120">
        <input id="nn" placeholder="Note: how you met, what they build" maxlength="500">
        <button class="btn primary">Create link</button>
        <label class="hosted-opt"><input type="checkbox" id="nh" checked> <b>Hosted</b>: their own dashboard at <i>name</i>.app.squidbrake.com,
          nothing to keep running on their laptop. Use a neutral name: it appears in the dashboard's address.</label></form>
      <div class="result" id="res"></div></div>
    </section>

      command arguments, file names, code, prompts or tool inputs here.</p>
    </main>`;
  document.getElementById("refresh").onclick = load;
  document.getElementById("logout").onclick = async () => {
    await fetch("/v1/admin/logout", { method: "POST", headers: { "X-Admin-Key": key } }).catch(() => {});
    store.set(""); key = ""; login();
  };
  document.getElementById("pw").onclick = () => passwordDialog(!me.has_password);
  document.getElementById("pw2")?.addEventListener("click", () => passwordDialog(true));
  document.getElementById("nf").onsubmit = create;
  document.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
    if (!confirm(b.dataset.warn)) return;
    await api(`/v1/admin/pilots/${encodeURIComponent(b.dataset.del)}`, { method: "DELETE" }); load();
  });
  document.querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => copy(b.dataset.copy, b));
  document.getElementById("allholds")?.addEventListener("change", (e) => {
    document.getElementById("stopped").classList.toggle("show-all", e.target.checked);
  });
  document.querySelectorAll("[data-mrr]").forEach((b) => b.onclick = async () => {
    const v = prompt(`Monthly revenue from ${b.dataset.name}, in dollars (0 = not paying):`, b.dataset.mrr || "");
    if (v === null || !/^\d+$/.test(v.trim())) return;
    await api(`/v1/admin/pilots/${encodeURIComponent(b.dataset.code)}/revenue`, { method: "POST", body: JSON.stringify({ mrr: Number(v.trim()) }) });
    load();
  });
  document.querySelectorAll("[data-rdone]").forEach((b) => b.onclick = async () => {
    await api(`/v1/admin/install-reports/${b.dataset.rdone}`, { method: "POST", body: JSON.stringify({ done: b.dataset.to === "1" }) });
    load();
  });
  document.querySelectorAll("[data-done]").forEach((b) => b.onclick = async () => {
    await api(`/v1/admin/team-requests/${b.dataset.done}`, { method: "POST", body: JSON.stringify({ done: b.dataset.to === "1" }) });
    load();
  });
}

// Traction: activation, retention, value, revenue, and open-source pull
const pct = (v) => v === null || v === undefined ? "–" : `${v > 0 ? "+" : ""}${v}%`;
function tractionPanel(v) {
  if (!v) return "";
  const top = Math.max(1, v.funnel[0].count || 0);
  const funnel = v.funnel.map((f, i) => `<div class="r"><span class="l">${esc(f.step)}</span><span class="c">${f.count}</span>
      <span class="bar"><i style="width:${Math.max(f.count ? 2 : 0, 100 * f.count / top)}%"></i></span>
      ${i ? `<span class="cv">${Math.round(100 * f.count / top)}% of created${v.funnel[i - 1].count ? ` · ${Math.round(100 * f.count / v.funnel[i - 1].count)}% of the step before` : ""}</span>` : ""}</div>`).join("");
  const maxA = Math.max(1, ...v.weeks.map((w) => w.active_pilots));
  const bars = v.weeks.map((w) => `<div title="Week to ${w.week_ending}: ${w.active_pilots} active, ${w.actions} actions">
      <span>${w.active_pilots}</span><i style="height:${Math.max(2, 40 * w.active_pilots / maxA)}px"></i></div>`).join("");
  const o = v.oss || {}, w = v.weeks.at(-1);
  const paying = v.paying.length ? v.paying.map((p) => `${p.company} $${p.mrr}`).join(", ") : "mark a pilot as paying from its row";
  return `<section id="traction"><div class="sec-h"><h2>Traction</h2><span class="sub">From signup to paying, and whether teams keep using it</span>
      <div class="act"><button class="btn" data-copy="${esc(tractionUpdate(v))}">Copy update</button></div></div>
    <div class="grid2">
      <div class="surface fun">${funnel}</div>
      <div class="surface" style="overflow:hidden">
        <div class="stats" style="border:0;border-radius:0">
          ${stat("MRR", `$${v.mrr.toLocaleString()}`, paying)}
          ${stat("ARR", `$${v.arr.toLocaleString()}`)}
          ${stat("Active pilots", `${w.active_pilots}${trend(v.active_pilots_wow)}`, "this week, vs last week")}
          ${stat("Actions", `${w.actions.toLocaleString()}${trend(v.actions_wow)}`, "this week, vs last week")}
          ${stat("Retention", `${v.retention_w1 === null ? "–" : v.retention_w1 + "%"}<small>W1</small> ${v.retention_w4 === null ? "–" : v.retention_w4 + "%"}<small>W4</small>`, "still active 1 and 4 weeks later")}
          ${stat("Time to first action", v.median_days_to_first_action === null ? "–" : `${v.median_days_to_first_action}<small>days</small>`, "median, from the link")}
          ${stat("Depth", `${v.actions_per_active_pilot}<small>actions / wk</small>`, `${v.agents_per_active_install} agents per install`)}
          ${stat("Stopped", v.stopped_this_week, (savedText(v.saved_this_week) ? "saved " + savedText(v.saved_this_week) : "caught by a rule this week") +
                 (v.paused_this_week ? ` · paused by emergency stop: ${v.paused_this_week}` : ""))}
          ${stat("Holds approved", v.approve_rate === null ? "–" : v.approve_rate + "%", v.median_seconds_to_decide === null ? "" : "decided in " + fmtSecs(v.median_seconds_to_decide) + " (median)")}
          ${stat("Teams asking", v.inbound_this_week, `${v.inbound_total} total, from the /team form`)}
          ${stat("GitHub", `${o.stars ?? "–"}<small>stars</small>`, `${o.forks ?? "–"} forks · ${o.contributors ?? "–"} contributors`)}
          ${stat("PyPI downloads", o.downloads_last_week === undefined || o.downloads_last_week === null ? "–" : Number(o.downloads_last_week).toLocaleString(), "last week, mirrors and CI included")}
        </div>
        <div class="weeks"><span class="lbl">Active pilots,<br>last 8 weeks</span><div class="wbars">${bars}</div></div>
      </div>
    </div></section>`;
}

function tractionUpdate(v) {
  const f = Object.fromEntries(v.funnel.map((x) => [x.step, x.count])), o = v.oss || {}, w = v.weeks.at(-1);
  return [`Squidbrake update, week to ${w.week_ending}`,
    `Revenue: $${v.mrr.toLocaleString()} MRR ($${v.arr.toLocaleString()} ARR), ${v.paying.length} paying`,
    `Pilots: ${f["Pilots created"]} created, ${f["First action"]} activated, ${w.active_pilots} active this week (${pct(v.active_pilots_wow)} WoW), ${f["Active 3+ days this week"]} active 3+ days`,
    `Retention: W1 ${v.retention_w1 ?? "–"}%, W4 ${v.retention_w4 ?? "–"}% · median ${v.median_days_to_first_action ?? "–"} days to first action`,
    `Usage: ${w.actions.toLocaleString()} agent actions this week (${pct(v.actions_wow)} WoW), ${v.actions_per_active_pilot} per active pilot`,
    `Value: ${v.stopped_this_week} risky actions stopped by a rule this week${savedText(v.saved_this_week) ? " (" + savedText(v.saved_this_week) + " saved)" : ""}${v.paused_this_week ? `, plus ${v.paused_this_week} paused by an emergency stop` : ""}, ${v.approve_rate ?? "–"}% of holds approved`,
    `Inbound: ${v.inbound_this_week} teams asked for help this week (${v.inbound_total} total)`,
    `Open source: ${o.stars ?? "–"} GitHub stars, ${o.forks ?? "–"} forks, ${o.contributors ?? "–"} contributors`].join("\n");
}

// Teams that filled in /team (from `connect all`, the dashboard, or a shared link): people who installed on their own
const FROM = { cli: "connect all", dashboard: "dashboard", github: "GitHub", site: "website" };
// Installs that failed, sent from the installer after a yes: the last lines pip / uv printed, home folder as ~
function failsPanel(fails) {
  const open = fails.filter((f) => !f.done);
  const rows = fails.slice(0, 50).map((f) => `<tr${f.done ? ' style="opacity:.55"' : ""}>
    <td><b>${esc(f.company || "Not a pilot")}</b><div class="mini">${esc(f.installer === "ps1" ? "Windows installer" : f.installer === "sh" ? "Mac / Linux installer" : "")}</div></td>
    <td>${esc(f.os || "–")}<div class="mini">${ago(f.created_at)}</div></td>
    <td style="max-width:220px">${esc(f.step || "–")}</td>
    <td><pre style="max-width:560px;max-height:220px;overflow:auto;white-space:pre-wrap;margin:0;font-size:12px">${esc(f.log)}</pre></td>
    <td><button class="btn" data-rdone="${f.id}" data-to="${f.done ? 0 : 1}">${f.done ? "Reopen" : "Mark fixed"}</button></td></tr>`).join("");
  return `<section id="fails"><div class="sec-h"><h2>Failed installs</h2>
      <span class="sub">${open.length ? `${open.length} to look at` : "Sent by the installer when it fails, only after the person says yes"}</span></div>
    ${fails.length ? `<div class="table-wrap"><table><thead><tr><th>Who</th><th>Computer</th><th>Where it stopped</th>
      <th>What it said</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="surface empty">None yet. When an install fails, the installer asks whether to send its last lines here.</div>`}
  </section>`;
}

// Where installs come from: clicks on a named link (/go/<channel>) -> installs that share stats -> used -> stopped
function sourcesPanel(src) {
  const top = Math.max(1, ...src.rows.map((r) => Math.max(r.clicks, r.installs)));
  const w = (n) => `${(100 * Math.max(0, n)) / top}%`;
  const bar = (r) => `<div class="src-bar" title="${r.clicks} clicks · ${r.installs} installs · ${r.used_this_week} used this week">
      <i class="u" style="width:${w(r.used_this_week)}"></i><i class="n" style="width:${w(r.installs - r.used_this_week)}"></i>
      <i class="c" style="width:${w(r.clicks - r.installs)}"></i></div>`;
  const rows = src.rows.map((r) => `<tr><td><b>${esc(r.channel)}</b>${bar(r)}</td><td class="num">${r.clicks || "–"}</td>
    <td class="num"><b>${r.installs}</b>${r.new ? ` <span class="mini">(${r.new} new)</span>` : ""}</td>
    <td class="num">${r.used_this_week}</td><td class="num">${r.stopped ? `<b style="color:var(--accent)">${r.stopped}</b>` : "0"}</td></tr>`).join("");
  return `<section id="sources"><div class="sec-h"><h2>Where people come from</h2><span class="sub">last ${src.days} days, per channel</span>
      <div class="act"><button class="btn" data-copy="${esc(location.origin + "/go/linkedin")}">Copy a tracked link</button></div></div>
    ${src.rows.length ? `<div class="table-wrap"><table><thead><tr><th>Channel</th><th>Link clicks</th>
      <th>Installs sharing stats</th><th>Used this week</th><th>Stopped something</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="legend"><span style="--c:var(--ok)">used this week</span><span style="--c:var(--link)">installed</span>
        <span style="--c:color-mix(in srgb, var(--link) 40%, transparent)">clicked only</span></div></div>`
      : `<div class="surface empty">Nothing yet. Post links as <code>${esc(location.origin)}/go/linkedin</code>, <code>/go/whatsapp</code>, <code>/go/hn</code>.</div>`}
    <p class="foot" style="margin-top:10px">A click is counted with no IP or cookie, and the install commands on that page carry the channel's name.
      Installs that say yes to stats report it, or pick where they heard about Squidbrake. "not said": skipped that question; "pilot": joined with a pilot code.</p>
  </section>`;
}

function teamPanel(asks) {
  const open = asks.filter((a) => !a.done);
  const rows = asks.slice(0, 50).map((a) => `<tr${a.done ? ' style="opacity:.55"' : ""}>
    <td><b>${esc(a.name)}</b><div class="mini"><a href="mailto:${esc(a.email)}">${esc(a.email)}</a></div></td>
    <td>${esc(a.company || "–")}<div class="mini">${a.team_size ? esc(a.team_size) + " people" : ""}</div></td>
    <td>${esc(a.agents || "–")}</td><td style="max-width:340px;white-space:pre-wrap">${esc(a.note || "")}</td>
    <td>${esc(FROM[a.source] || a.source || "–")}<div class="mini">${ago(a.created_at)}</div></td>
    <td><button class="btn" data-done="${a.id}" data-to="${a.done ? 0 : 1}">${a.done ? "Reopen" : "Mark replied"}</button></td></tr>`).join("");
  return `<section id="requests"><div class="sec-h"><h2>Teams asking for help</h2>
      <span class="sub">${open.length ? `${open.length} waiting for a reply` : "People who installed on their own and want help"}</span>
      <div class="act"><a class="btn" href="/team" target="_blank" rel="noopener">Open the form</a></div></div>
    ${asks.length ? `<div class="table-wrap"><table><thead><tr><th>Who</th><th>Company</th><th>Agents</th><th>Note</th>
      <th>From</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="surface empty">Nobody yet. The form is linked from <code>connect all</code> and the dashboard's Team page.</div>`}
  </section>`;
}

const stat = (k, v, note = "", warn = false, tone = "") => `<div class="stat${warn ? " warn" : ""}${tone ? " t-" + tone : ""}"><div class="k">${k}</div><div class="v">${typeof v === "number" ? v.toLocaleString() : v}</div>${note ? `<div class="n">${esc(note)}</div>` : ""}</div>`;
const greeting = () => { const h = new Date().getHours(); return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"; };
const trend = (v) => v === null || v === undefined ? "" : `<small class="${v >= 0 ? "up" : "down"}">${v > 0 ? "+" : ""}${v}%</small>`;

// What to send a cofounder every week: usage, not output
function weeklyReport(d) {
  const s = d.scorecard, w = d.week, day = new Date().toISOString().slice(0, 10);
  const lines = [`Squidbrake pilots, week to ${day}`,
    `Active today: ${s.active_today} · this week: ${s.active_this_week} · 3+ days this week: ${s.active_3_plus_days} (of ${d.pilots.length} pilots, ${d.installs} installs)`,
    `Back from last week: ${s.retained} of ${s.active_last_week}`,
    `Actions: ${w.events} · held for a person: ${w.held} (approved ${w.approved}, rejected ${w.rejected}) · blocked by a rule: ${w.blocked}${w.paused ? ` · paused by emergency stop: ${w.paused}` : ""}`,
    `Holds approved: ${s.approve_rate === null ? "none decided yet" : s.approve_rate + "%"}`, "", "Per pilot:"];
  for (const p of d.pilots) lines.push(`- ${p.company}: active ${p.days_this_week}/7 days, ${p.week.events} actions, ${p.week.held} held, ${p.week.blocked} blocked${p.paused ? `, ${p.paused} paused by emergency stop` : ""} (${p.stage}${p.outdated ? ", outdated version" : ""})`);
  return lines.join("\n");
}

function row(p) {
  const [label, cls] = STAGE[p.stage] || [p.stage, "s-sent"];
  const max = Math.max(1, ...p.daily);
  const spark = `<div class="spark" title="Actions per day, last 14 days">${p.daily.map((v) => `<i style="height:${Math.max(1, (v / max) * 34)}px" title="${v}"></i>`).join("")}</div>`;
  const w = p.week;
  const agents = Object.entries(p.agents).map(([a, n]) => `<span class="chip">${esc(a)} · ${n}</span>`).join("") || `<span class="sub">none yet</span>`;
  const approvals = (p.rule_approvals || []).slice(0, 5).map((r) => `<div class="mini" title="${r.approved} of ${r.decided} holds approved">${esc(r.rule)}: ${r.approve_pct}% approved (${r.decided})${r.always_allowed ? ` <b>· always allowed: make it auto-allow? (their dashboard: Rules → Allow it)</b>` : ""}</div>`).join("");
  const hits = (Object.entries(p.rules_hit).map(([r, n]) => `<span class="chip r">${esc(r)} · ${n}</span>`).join("") || `<span class="sub">nothing</span>`) + approvals;
  return `<tr><td><div class="co">${esc(p.company)}</div><div class="sub">${esc(p.contact || "")}</div>
      <div class="sub">${esc(p.note || "")}</div><div class="mini"><span class="code">${esc(p.code)}</span> · link opened ${p.page_views}×</div>
      ${p.hosted ? `<div class="mini">hosted: <a href="${esc(p.dashboard)}" target="_blank" rel="noopener">${esc((p.dashboard || "").replace("https://", ""))}</a></div>
      <div class="mini">${p.keys_revealed_at ? "keys shown " + ago(p.keys_revealed_at) : p.keys_waiting ? "keys waiting on their page" : ""}${p.error ? `<span style="color:var(--accent)"> · ${esc(p.error)}</span>` : ""}</div>` : ""}</td>
    <td><span class="pill ${cls}">${label}</span><div>${healthBadge(p)}</div><div class="mini">last seen ${ago(p.last_seen)}</div>
      <div class="mini">${p.installs} install${p.installs === 1 ? "" : "s"}${p.versions.length ? " · v" + esc(p.versions.join(", ")) : ""}${p.outdated ? ` <span class="pill s-quiet" title="Latest is ${esc(d_latest)}">outdated</span>` : ""}${p.modes.includes("shadow") ? " · shadow" : ""}</div>
      ${p.connected && p.connected.length ? `<div class="mini">connected: ${esc(p.connected.join(", "))}</div>` : ""}</td>
    <td>${spark}<div class="mini"><b>${p.total_events.toLocaleString()}</b> actions all time</div></td>
    <td class="num"><div><b>${w.events}</b> actions</div><div class="mini">${w.held} held · ${w.approved} approved · ${w.rejected} rejected</div>
      <div class="mini">${w.blocked} blocked${w.would_block ? ` · ${w.would_block} would block` : ""}${w.timed_out ? ` · ${w.timed_out} timed out` : ""}</div>
      ${p.paused ? `<div class="mini">paused by emergency stop: ${p.paused}</div>` : ""}
      ${p.stopped ? `<div class="mini"><b>stopped ${p.stopped}</b>${savedText(p.saved) ? " · saved " + esc(savedText(p.saved)) : ""}</div>` : ""}
      ${p.decide_median_s !== null && p.decide_median_s !== undefined ? `<div class="mini">decided in ${fmtSecs(p.decide_median_s)} (median)</div>` : ""}
      ${p.trend !== null && p.trend !== undefined ? `<div class="mini"><span class="${p.trend >= 0 ? "up" : "down"}">${p.trend > 0 ? "+" : ""}${p.trend}%</span> vs last week</div>` : ""}</td>
    <td>${agents}</td><td>${hits}</td>
    <td><div class="acts">${followUp(p) ? `<button class="btn" data-copy="${esc(followUp(p))}" title="A message for where they are now">Follow-up</button>` : ""}
      <button class="btn" data-copy="${esc(p.link)}">Copy link</button>
      <button class="btn" data-mrr="${p.mrr || ""}" data-code="${esc(p.code)}" data-name="${esc(p.company)}" title="Monthly revenue from this pilot">${p.mrr ? "$" + Number(p.mrr).toLocaleString() + "/mo" : "Set revenue"}</button>
      <button class="icon-btn" title="Delete pilot" data-del="${esc(p.code)}" data-warn="${esc(deleteWarning(p))}">Delete</button></div></td></tr>
    ${p.catches && p.catches.length ? `<tr class="catches"><td colspan="7"><details><summary>What it held or blocked · ${p.catches.length}</summary>
      <table class="inner"><thead><tr><th>When</th><th>Agent</th><th>Action</th><th>Why</th><th>Outcome</th><th>Would have changed</th><th>Decided in</th></tr></thead>
      <tbody>${p.catches.map(catchRow).join("")}</tbody></table>
      <div class="mini" style="margin-top:6px">Program only (never its arguments, files or prompts), the rule's reason, and sizes as numbers.</div></details></td></tr>` : ""}`;
}

const HEALTH = { "at risk": ["At risk", "risk"], "churned": ["Churned", "churn"] };
function healthBadge(p) {
  const [label, cls] = HEALTH[p.health] || ["", ""];
  return label ? `<span class="health ${cls}" title="No activity for ${p.idle_days} days">${label} · ${p.idle_days} days idle</span>` : "";
}
const savedText = (s) => Object.entries(s || {}).map(([k, v]) => `${Number(v).toLocaleString()} ${v === 1 ? k.replace(/s$/, "") : k}`).join(", ");
const fmtSecs = (s) => s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.round(s / 3600)} h`;
// What the action would have done. Sizes when the hook measured them (rows, files, commits); otherwise the kind of damage,
// from the program alone (we never get its arguments), e.g. an `rm` of a file that wasn't there
const DAMAGE = [[/^(rm|rmdir|rd|del|erase|remove-item|ri|rimraf|shred|unlink)$/, "Files deleted for good"],
  [/^git$/, "Git history rewritten or work lost"], [/^(psql|mysql|mariadb|sqlite3|mongosh?|redis-cli)$/, "Database data changed or dropped"],
  [/^(terraform|tofu|pulumi|cdk)$/, "Cloud infrastructure changed or destroyed"], [/^(aws|gcloud|gsutil|az)$/, "Cloud resources changed or deleted"],
  [/^(kubectl|helm)$/, "A live cluster changed"], [/^(docker|podman)$/, "Containers, images or volumes removed"],
  [/^(dd|mkfs.*|diskpart|format)$/, "A disk overwritten"], [/^(curl|wget|iwr|irm)$/, "Code from the internet run unread"]];
const KIND_DAMAGE = { catastrophic: "A home folder, a drive or the system wiped", irreversible: "A change that can't be undone",
  hidden: "Code run that nobody read first" };
function consequence(x) {
  const sized = savedText(x.saved);
  if (sized) return `<b>${esc(sized)}</b>`;
  const hit = DAMAGE.find(([re]) => re.test(x.program || ""));
  const text = hit ? hit[1] : KIND_DAMAGE[x.category] || "";
  return text ? `${esc(text)}<div class="mini">size not measured</div>` : '<span class="mini">–</span>';
}

// Every pilot's held or blocked actions in one list, newest first: what the agent tried, why it stopped, what it would have changed
const STOPPED = ["rejected", "blocked"];
function stoppedPanel(pilots) {
  const all = pilots.flatMap((p) => (p.catches || []).map((x) => ({ ...x, company: p.company })))
    .sort((a, b) => (b.t || "").localeCompare(a.t || ""));
  const stopped = all.filter((x) => STOPPED.includes(x.outcome));
  const saved = {};
  for (const x of stopped) for (const [k, v] of Object.entries(x.saved || {})) saved[k] = (saved[k] || 0) + Number(v);
  const rows = all.map((x) => `<tr${STOPPED.includes(x.outcome) ? "" : ' class="hold"'}>
    <td class="sub" style="white-space:nowrap">${esc((x.t || "").replace("T", " "))}</td>
    <td><b>${esc(x.company)}</b><div class="mini">${esc(x.agent || "")}</div></td>
    <td>${x.program ? `<code>${esc(x.program)}</code>${x.category ? `<div class="mini">${esc(x.category)}</div>` : ""}` : `<code>${esc(x.tool || "")}</code>`}</td>
    <td>${esc(x.why || "")}<div class="mini">${esc(x.rule || "")}</div></td>
    <td class="${OUTCOME[x.outcome] || ""}" style="font-weight:500">${esc(x.outcome || "")}${x.decide_s !== undefined && x.decide_s !== null ? `<div class="mini">in ${fmtSecs(x.decide_s)}</div>` : ""}</td>
    <td>${consequence(x)}</td></tr>`).join("");
  const sub = stopped.length ? `${stopped.length} stopped${savedText(saved) ? " · would have changed " + savedText(saved) : ""}` : "Rejected or blocked actions, from every pilot";
  return `<section id="stopped"><div class="sec-h"><h2>Stopped</h2><span class="sub">${esc(sub)}</span>
      ${all.length > stopped.length ? `<div class="act"><label class="sub"><input type="checkbox" id="allholds"> Show approved and waiting holds too (${all.length - stopped.length})</label></div>` : ""}</div>
    ${all.length ? `<div class="table-wrap"><table><thead><tr><th>When</th><th>Company</th><th>Action</th><th>Why it stopped</th><th>Outcome</th><th>What it would have done</th></tr></thead>
      <tbody>${rows}</tbody></table>${stopped.length ? "" : `<div class="empty stopped-none">Nothing rejected or blocked yet.</div>`}</div>
      <p class="foot" style="margin-top:8px">The program only, never its arguments, files or prompts. Sizes in bold were measured on their machine before the action ran (files, rows, commits); otherwise the kind of damage, from the program.</p>`
      : `<div class="surface empty">Nothing held or blocked yet. Shows up here within 2 minutes of a block or a no.</div>`}
  </section>`;
}

const OUTCOME = { approved: "o-approved", rejected: "o-rejected", blocked: "o-blocked", "timed out": "o-timed", waiting: "o-waiting" };
function catchRow(x) {
  const action = x.program ? `<code>${esc(x.program)}</code>${x.category ? ` <span class="sub">${esc(x.category)}</span>` : ""}` : `<code>${esc(x.tool || "")}</code>`;
  return `<tr><td class="sub" style="white-space:nowrap">${esc(x.t.replace("T", " "))}</td><td>${esc(x.agent || "")}</td><td>${action}</td>
    <td>${esc(x.why || "")}<div class="mini">${esc(x.rule || "")}</div></td>
    <td class="${OUTCOME[x.outcome] || ""}" style="font-weight:500">${esc(x.outcome || "")}</td>
    <td>${consequence(x)}</td><td class="mini">${x.decide_s !== undefined ? fmtSecs(x.decide_s) : "–"}</td></tr>`;
}

// Deleting a hosted pilot switches its dashboard off, and Squidbrake fails closed: their agents stop until they remove it
function deleteWarning(p) {
  const base = `Delete the pilot ${p.company} (${p.code}) and its stats? Its link stops working.`;
  if (!p.hosted) return `${base}

Their own Squidbrake keeps working; it just stops sending usage counts here.`;
  const connected = p.installs > 0 || p.keys_revealed_at;
  return `${base}

Their hosted dashboard is switched off and its data deleted.` + (connected
    ? `

THEIR AGENTS WILL STOP WORKING: Squidbrake blocks everything when its dashboard is gone. Ask them to run this first:

squidbrake connect all --remove`
    : "");
}

async function create(e) {
  e.preventDefault();
  const company = document.getElementById("nc").value.trim();
  const r = await api("/v1/admin/pilots", { method: "POST", body: JSON.stringify({ company,
    contact: document.getElementById("nk").value.trim(), note: document.getElementById("nn").value.trim(),
    hosted: document.getElementById("nh").checked }) });
  const msg = message(company, r.link, !!r.dashboard);
  await load();                                   // the new pilot shows in the table; then show its link
  const res = document.getElementById("res");
  res.style.display = "block";
  res.innerHTML = `<div><b>Link for ${esc(company)}:</b> <a href="${esc(r.link)}" target="_blank" rel="noopener">${esc(r.link)}</a></div>
    <p class="sub">A message you can send (edit as you like):</p><textarea id="msg">${esc(msg)}</textarea>
    <div class="row"><button class="btn primary" id="cm">Copy message</button><button class="btn" id="cl">Copy link</button>
    <a class="btn" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">Open in WhatsApp</a></div>`;
  document.getElementById("cm").onclick = (ev) => copy(document.getElementById("msg").value, ev.target);
  document.getElementById("cl").onclick = (ev) => copy(r.link, ev.target);
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => (btn.textContent = t), 1400); }
  catch { prompt("Copy this:", text); }
}

load();
setInterval(() => { if (key && !document.getElementById("res")?.style.display.includes("block")) load(); }, 60000);
</script>
</body>
