<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Squidbrake" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Squidbrake</title>
<style>
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s 0s ease-in-out infinite alternate}
.sr{animation-direction:alternate-reverse}
@keyframes sway{from{transform:rotate(3deg)}to{transform:rotate(-3deg)}}
.led{animation:led 4.8s 0s infinite}
@keyframes led{0%,52%,80%,100%{fill:#2FD574}54%,60%,66%,72%{fill:#FF3B24}57%,63%,69%,75%{fill:#9A2C1F}}
.bk2{animation:brk 4.8s 0s infinite cubic-bezier(.3,.7,.3,1)}
@keyframes brk{0%,53%{transform:translateY(0)}60%,76%{transform:translateY(3.2px)}90%,100%{transform:translateY(0)}}
.bd2{animation:jolt 4.8s 0s infinite}
@keyframes jolt{0%,53%,66%,100%{transform:translateX(0)}55%{transform:translateX(-.9px)}57%{transform:translateX(.9px)}59%{transform:translateX(-.6px)}61%{transform:translateX(.4px)}63%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tn{stroke-dashoffset:0}}</style>
<g class="mk">
  <g class="hd"><path fill="#1E2A23" d="M16 30V21.5C16 12.4 23.2 5 32 5C40.8 5 48 12.4 48 21.5V30Z"/></g>
  <g fill="none" stroke="#1E2A23" stroke-width="5" stroke-linecap="round">
    <g class="sw sl"><path class="tn t1" pathLength="1" d="M23 34V48.2C23 51.4 21.7 53.9 19.6 55.8"/></g>
    <path class="tn t2" pathLength="1" d="M32 34V44.6"/>
    <g class="sw sr"><path class="tn t3" pathLength="1" d="M41 34V48.2C41 51.4 42.3 53.9 44.4 55.8"/></g>
  </g>
  <g class="bk"><g class="bk2"><circle fill="#1E2A23" cx="32" cy="52.6" r="2.9"/></g></g>
  <g class="bd"><g class="bd2"><rect fill="#F2622E" x="11" y="24.5" width="42" height="11" rx="5.5"/></g></g>
  <g class="ld"><circle class="led" fill="#2FD574" cx="41.2" cy="30" r="2.5"/></g>
</g>
</svg>
