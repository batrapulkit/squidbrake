name: native installers
# Builds Squidbrake without Python (PyInstaller) and packages it: an MSI for Windows, a .pkg for macOS (Apple
# silicon) and a tarball for Linux. On a release they're attached to it; run by hand, they're kept as artifacts.
# Not code-signed yet: Windows SmartScreen and macOS Gatekeeper warn when opened by hand (MDM installs are fine).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-15, name: macos-arm64 }   # macos-14 runners are retired
          - { os: ubuntu-latest, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write
      contents: write       # attaches the files to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - run: pyinstaller --noconfirm packaging/native/squidbrake.spec
      - name: version
        shell: bash
        run: echo "VERSION=$(python -c 'import squidbrake; print(squidbrake.__version__)')" >> "$GITHUB_ENV"
      - name: smoke test
        shell: bash
        run: |
          dist/squidbrake/squidbrake --version
          echo '{"tool_name":"Bash","tool_input":{"command":"ls"},"session_id":"ci"}' |
            GATEWAY_FAIL_OPEN=1 dist/squidbrake/squidbrake "$(python -c 'import pathlib,sys; print(next(pathlib.Path("dist/squidbrake").rglob("agent_hook.py")))')" codex --url http://127.0.0.1:9 --key x

      - name: MSI
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          # an absolute bind path (a relative one is read from the .wxs folder), and -wx: a missing folder must fail,
          # not make an empty installer
          wix build packaging/native/squidbrake.wxs -wx -d Version=$VERSION -bindpath "src=$GITHUB_WORKSPACE/dist/squidbrake" \
            -o out/squidbrake-$VERSION-${{ matrix.name }}.msi
          rm -f out/*.wixpdb      # WiX's debug file, not something to ship
      - name: pkg
        if: runner.os == 'macOS'
        run: |
          mkdir -p root/usr/local/lib scripts out
          cp -R dist/squidbrake root/usr/local/lib/squidbrake
          cp packaging/native/postinstall scripts/postinstall && chmod +x scripts/postinstall
          pkgbuild --root root --scripts scripts --identifier com.squidbrake.cli --version "$VERSION" \
            out/squidbrake-$VERSION-${{ matrix.name }}.pkg
      - name: tarball
        if: runner.os == 'Linux'
        run: mkdir -p out && tar -C dist -czf out/squidbrake-$VERSION-${{ matrix.name }}.tar.gz squidbrake
      - name: installers hold the program
        shell: bash
        run: |
          for f in out/*; do
            size=$(wc -c < "$f"); echo "$f: $size bytes"
            [ "$size" -gt 10000000 ] || { echo "$f is too small to hold Squidbrake"; exit 1; }
          done

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*
      - uses: actions/upload-artifact@v4
        with:
          name: squidbrake-${{ matrix.name }}
          path: out/*
      - name: attach to the release
        if: github.event_name == 'release'
        shell: bash
        # each file twice: with its version, and without it, so .../releases/latest/download/squidbrake-windows-x64.msi
        # always gives the newest one (the link the docs use)
        run: |
          for f in out/*; do cp "$f" "${f/-$VERSION/}"; done
          gh release upload "${{ github.event.release.tag_name }}" out/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
