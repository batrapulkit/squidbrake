name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python tests/e2e_business_scenario.py

  postgres:
    # the gateway's own tests against Postgres, as given by Supabase (postgres://), once in public and once in a schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: gw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-only
      # in the order a plain `pytest` runs them: some read reports over the whole shared database
      TESTS: >-
        tests/test_approval_integrity.py tests/test_audit.py tests/test_capabilities.py tests/test_change_control.py
        tests/test_import_sqlite.py tests/test_observe_report.py tests/test_postgres.py tests/test_reported_bypasses.py tests/test_server.py
        tests/test_steering.py tests/test_team_features.py tests/test_threat_model.py tests/test_unreadable.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt "psycopg[binary]>=3.1" pytest
      - name: tables in public
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/gw
        run: pytest -q $TESTS
      - name: tables in their own schema (DB_SCHEMA)
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/gw_schema
          DB_SCHEMA: squidbrake
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE gw_schema"
          pytest -q $TESTS

  insights-reporting:
    # The Insights adapter is distinct from the gateway's SQLAlchemy database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: reporting
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_INSIGHTS_DATABASE_URL: postgresql://postgres:ci-only@localhost:5432/reporting
      PGPASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt "psycopg[binary,pool]>=3.2" pytest
      - run: psql -h localhost -U postgres -d reporting -c "CREATE ROLE anon; CREATE ROLE authenticated;"
      - run: pytest -q tests/test_reporting_ingest.py tests/test_reporting_export.py

  package:
    # what `pip install squidbrake` gets: build the wheel, install it on its own, start it, block something
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - run: python -m venv /tmp/pkg && /tmp/pkg/bin/pip install dist/*.whl
      - name: start the installed gateway and send it a dangerous command
        env:
          SQUIDBRAKE_HOME: /tmp/sbhome
          GATEWAY_AUTH: "off"
        run: |
          cd /tmp
          /tmp/pkg/bin/squidbrake --version
          /tmp/pkg/bin/squidbrake run --port 8099 --no-browser &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8099/health && break; sleep 1; done
          test -f /tmp/sbhome/rules.yaml
          curl -sf -X POST http://127.0.0.1:8099/v1/events -H 'Content-Type: application/json' \
            -d '{"name":"Bash","input":{"command":"rm -rf ~/"}}' | tee /tmp/out.json
          grep -q '"decision":"deny"' /tmp/out.json
