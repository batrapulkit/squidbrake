"hooklog.py" = "squidbrake/hooklog.py"
"connect.py" = "squidbrake/connect.py"
"service.py" = "squidbrake/service.py"
"claude_hook.py" = "squidbrake/claude_hook.py"
"agent_hook.py" = "squidbrake/agent_hook.py"
"gw_async.py" = "squidbrake/gw_async.py"
"gateway_proxy.py" = "squidbrake/gateway_proxy.py"
"gateway_mcp.py" = "squidbrake/gateway_mcp.py"
"demo_apps_mcp.py" = "squidbrake/demo_apps_mcp.py"
"client.py" = "squidbrake/client.py"
"rules.yaml" = "squidbrake/rules.yaml"
"rules.shipped" = "squidbrake/rules.shipped"
"dashboard.html" = "squidbrake/dashboard.html"
"approve.html" = "squidbrake/approve.html"

[tool.hatch.build.targets.sdist]
only-include = ["squidbrake", "server.py", "commands.py", "risk.py", "mcp_hub.py", "mcp_catalog.py", "outbound.py", "mcp_oauth.py", "policy_edit.py", "siem.py", "selfguard.py", "weekly.py", "integrity.py", "onboard.py", "taint.py", "pilot.py", "telemetry.py", "flow.py", "verify.py", "signing.py", "offline.py", "proof.py", "brief.py", "passkeys.py", "evidence.py", "lockdown.py", "license.py", "effects.py", "undo.py", "shell_guard.py", "runs.py", "hooklog.py", "connect.py", "service.py", "claude_hook.py", "agent_hook.py",
                "gw_async.py", "gateway_proxy.py", "gateway_mcp.py", "demo_apps_mcp.py", "client.py", "rules.yaml", "rules.shipped",
                "dashboard.html", "approve.html", "README.md", "LICENSE", "pyproject.toml"]
